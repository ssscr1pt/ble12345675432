name: "Build Flipper Application"
on: [push, pull_request]

jobs:
  ufbt-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build with ufbt
        uses: flipperdevices/flipperzero-ufbt-action@v1
        with:
          app-dir: .
          sdk-channel: unleashed
